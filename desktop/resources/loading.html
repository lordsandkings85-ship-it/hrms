<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Workora HRMS — Starting...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 32px;
      user-select: none;
      -webkit-user-select: none;
      -webkit-app-region: drag;
    }
    .logo {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(99,102,241,0.4);
    }
    .logo img { width: 100%; height: 100%; object-fit: cover; }
    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #e2e8f0, #a5b4fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      font-size: 13px;
      color: #64748b;
      font-weight: 500;
    }
    .spinner-ring {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(99,102,241,0.2);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status {
      font-size: 12px;
      color: #475569;
      font-weight: 500;
      letter-spacing: 0.05em;
    }
    .dots::after {
      content: '';
      animation: dots 1.5s steps(4, end) infinite;
    }
    @keyframes dots {
      0%   { content: ''; }
      25%  { content: '.'; }
      50%  { content: '..'; }
      75%  { content: '...'; }
      100% { content: ''; }
    }
  </style>
</head>
<body>
  <div class="logo">
    <img src="../build/icon-256.png" alt="Workora HRMS Logo" />
  </div>
  <div style="text-align:center; display:flex; flex-direction:column; align-items:center; gap:8px;">
    <h1>Workora HRMS</h1>
    <p>Enterprise Human Resource Management System</p>
  </div>
  <div class="spinner-ring"></div>
  <p class="status">Starting services<span class="dots"></span></p>
</body>
</html>
