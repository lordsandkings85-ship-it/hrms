name: Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (x64 NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend && npm ci
          cd ../desktop && npm ci

      - name: Build Windows Installer
        run: |
          cd desktop
          npm run build:win
        env:
          VITE_API_URL: https://hrms-backend-rl2c.onrender.com/api/v1
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            desktop/release/*.exe
            desktop/release/*.blockmap
            desktop/release/latest.yml
          if-no-files-found: error

  build-macos:
    name: Build macOS (ARM64 & x64 DMG)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend && npm ci
          cd ../desktop && npm ci

      - name: Disable Spotlight Indexing
        run: |
          sudo mdutil -a -i off || true

      - name: Build macOS DMGs
        run: |
          cd desktop
          npm run build:all

          # Detach any lingering volumes before building ARM64
          for v in /Volumes/Workora*; do
            [ -d "$v" ] && hdiutil detach "$v" -force || true
          done

          echo "=== Packaging macOS ARM64 (Apple Silicon) ==="
          npx cross-env CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --mac --arm64 --publish never

          # Backup ARM64 updater manifest
          cp release/latest-mac.yml release/latest-mac-arm64.yml

          # Ensure volumes are unmounted and disk cache flushes before building x64
          sleep 5
          for v in /Volumes/Workora*; do
            [ -d "$v" ] && hdiutil detach "$v" -force || true
          done

          echo "=== Packaging macOS x64 (Intel) ==="
          npx cross-env CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --mac --x64 --publish never

          # Merge ARM64 and x64 manifests into unified latest-mac.yml for multi-arch auto updates
          node -e "
            const fs = require('fs');
            const arm64Path = 'release/latest-mac-arm64.yml';
            const x64Path = 'release/latest-mac.yml';
            if (fs.existsSync(arm64Path) && fs.existsSync(x64Path)) {
              const arm64 = fs.readFileSync(arm64Path, 'utf8');
              const x64 = fs.readFileSync(x64Path, 'utf8');
              const arm64FilesMatch = arm64.match(/files:\r?\n([\s\S]*?)(?=\r?\n[a-zA-Z0-9_-]+:|$)/);
              const x64FilesMatch = x64.match(/files:\r?\n([\s\S]*?)(?=\r?\n[a-zA-Z0-9_-]+:|$)/);
              if (arm64FilesMatch && x64FilesMatch) {
                const combinedFiles = 'files:\n' + arm64FilesMatch[1].trimEnd() + '\n' + x64FilesMatch[1].trimEnd();
                const updated = x64.replace(/files:\r?\n[\s\S]*?(?=\r?\n[a-zA-Z0-9_-]+:|$)/, combinedFiles);
                fs.writeFileSync(x64Path, updated);
                console.log('Successfully merged latest-mac.yml for multi-arch:');
                console.log(updated);
              }
            }
          "

          # Final detach cleanup
          sleep 2
          for v in /Volumes/Workora*; do
            [ -d "$v" ] && hdiutil detach "$v" -force || true
          done
        env:
          VITE_API_URL: https://hrms-backend-rl2c.onrender.com/api/v1
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.blockmap
            desktop/release/latest-mac.yml
          if-no-files-found: error

  publish-release:
    name: Publish Release Assets
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: always() && !cancelled() && (needs.build-windows.result == 'success' || needs.build-macos.result == 'success')
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: windows-installer
          path: release-assets

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: macos-installers
          path: release-assets

      - name: Attach Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v3.2.0' }}
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
